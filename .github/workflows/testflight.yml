name: TestFlight (iOS)

# Compile l'app iOS native sur un runner macOS de GitHub et l'envoie sur
# TestFlight — aucun Mac requis de ton côté. Se lance à la main (bouton
# « Run workflow ») ou en poussant un tag « ios-v… » (ex. ios-v1.0.1).
on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: native-ios
    env:
      SCHEME: LiptonThes
      KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner Xcode
        run: |
          # Prend le Xcode stable le plus récent présent sur le runner : les
          # versions installées changent au fil des images, donc pas de version figée.
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Installer la clé App Store Connect
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Archiver (signature auto via la clé API)
        run: |
          xcodebuild archive \
            -project LiptonThes.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LiptonThes.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Exporter l'IPA
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/LiptonThes.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Envoyer sur TestFlight
        run: |
          IPA=$(find build/export -name '*.ipa' | head -1)
          echo "Upload de $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Conserver l'IPA en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiptonThes-ipa
          path: native-ios/build/export/*.ipa
          if-no-files-found: ignore
