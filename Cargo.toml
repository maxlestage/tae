[package]
name = "lipton-thes"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Sachets de thé Lipton triés par couleurs — front Yew / WebAssembly."
publish = false

[dependencies]
gloo-events = "0.3.0"
gloo-timers = "0.4.0"
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["AddEventListenerOptions", "AudioContext", "AudioDestinationNode", "AudioNode", "AudioParam", "BaseAudioContext", "CssStyleDeclaration", "Document", "DomRect", "DomTokenList", "Element", "Event", "EventTarget", "GainNode", "HtmlElement", "HtmlCollection", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "KeyboardEvent", "MediaQueryList", "MouseEvent", "Navigator", "NodeList", "OscillatorNode", "OscillatorType", "Performance", "PointerEvent", "ServiceWorkerContainer", "Storage", "Window", "AudioScheduledSourceNode", "Node", "ScrollBehavior", "ScrollToOptions", "WheelEvent"] }
yew = { version = "0.23.0", features = ["csr"] }

[build-dependencies]
serde_json = "1.0.151"

[profile.release]
# Binaire WASM le plus léger possible (téléchargé par chaque visiteur).
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
