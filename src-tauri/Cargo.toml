[package]
name = "lipton-thes"
version = "1.0.0"
description = "Sachets de thé Lipton triés par couleurs"
authors = ["Maxime Nathan Lestage"]
edition = "2021"
rust-version = "1.77.2"

# La bibliothèque est le point d'entrée commun desktop / mobile :
# staticlib (iOS) et cdylib (Android) sont requis par Tauri v2.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Utilisé par `tauri dev` / `tauri build` pour activer les devtools.
default = []
